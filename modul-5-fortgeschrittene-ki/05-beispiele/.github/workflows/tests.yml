name: Tests

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'modul-5-fortgeschrittene-ki/05-beispiele/**'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'modul-5-fortgeschrittene-ki/05-beispiele/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r modul-5-fortgeschrittene-ki/05-beispiele/tests/requirements-test.txt
    
    - name: Lint with flake8
      run: |
        flake8 modul-5-fortgeschrittene-ki/05-beispiele/*.py \
                modul-5-fortgeschrittene-ki/05-beispiele/tests/ \
                --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Run tests with pytest
      run: |
        cd modul-5-fortgeschrittene-ki/05-beispiele && \
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./modul-5-fortgeschrittene-ki/05-beispiele/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  coverage:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r modul-5-fortgeschrittene-ki/05-beispiele/tests/requirements-test.txt
    
    - name: Generate coverage report
      run: |
        cd modul-5-fortgeschrittene-ki/05-beispiele && \
        pytest tests/ --cov=. --cov-report=html --cov-report=term
    
    - name: Check coverage threshold
      run: |
        cd modul-5-fortgeschrittene-ki/05-beispiele && \
        pytest tests/ --cov=. --cov-fail-under=85

