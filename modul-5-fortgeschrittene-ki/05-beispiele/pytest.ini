[pytest]
# Pytest Konfiguration für Modul 5 Beispiele

# Testverzeichnis
testpaths = tests

# Python Dateien
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ausgabe-Optionen
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85

# Marker
markers =
    unit: Unit Tests
    integration: Integration Tests
    slow: Langsame Tests
    mock: Tests mit Mocks

# Timeout
timeout = 30

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

