[pytest]
# Zentrale Pytest Konfiguration für alle Module

# Test-Verzeichnisse
testpaths =
    modul-1-mindset-setup/05-beispiele/tests
    modul-2-python-grundlagen/05-beispiele/tests

# Ignoriere unvollständige Tests (für Lernzwecke gedacht)
# Modul 3, 4 und 5 enthalten Skelett-Implementierungen für Übungszwecke
python_ignore =
    modul-3-datenverarbeitung-dateien/05-beispiele/tests/test_robuste_verarbeitung.py
    modul-3-datenverarbeitung-dateien/05-beispiele/tests/test_wetter_api.py
    modul-4-agentic-coding/05-beispiele/tests/test_after_refactoring.py
    modul-4-agentic-coding/05-beispiele/tests/test_before_refactoring.py
    modul-4-agentic-coding/05-beispiele/tests/test_test_calculator.py

# Python Dateien
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ausgabe-Optionen
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --import-mode=importlib

# Marker
markers =
    unit: Unit Tests
    integration: Integration Tests
    slow: Langsame Tests
    mock: Tests mit Mocks

# Timeout
timeout = 30

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

