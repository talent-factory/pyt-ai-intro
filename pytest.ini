[pytest]
# Zentrale Pytest Konfiguration für alle Module

# Test-Verzeichnisse
testpaths = 
    modul-1-mindset-setup/05-beispiele/tests
    modul-2-python-grundlagen/05-beispiele/tests
    modul-3-datenverarbeitung-dateien/05-beispiele/tests
    modul-4-agentic-coding/05-beispiele/tests
    modul-5-fortgeschrittene-ki/05-beispiele/tests

# Python Dateien
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ausgabe-Optionen
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Marker
markers =
    unit: Unit Tests
    integration: Integration Tests
    slow: Langsame Tests
    mock: Tests mit Mocks

# Timeout
timeout = 30

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

